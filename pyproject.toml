[project]
name = "blind-control"
version = "0.1.0"
description = "Home Assistant integration for rule, override, oversteer and sun based cover control"
requires-python = ">=3.13"

[dependency-groups]
dev = ["pytest-homeassistant-custom-component", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "SIM102"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant"]
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
